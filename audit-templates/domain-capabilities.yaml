# Domain capability signals for KB Creation Framework v3.1 recommendations.
# These benchmark-derived overrides complement provider-native category labels.
# Operators should refresh per major model release or benchmark update.
_about:
  last_updated: 2026-06-07
  caveats:
    - "Benchmark data commonly lags current model releases by 3-6 months."
    - "Benchmark performance is not the same as real-world KB-build fit."
    - "Operator should refresh this file when selecting models for high-stakes builds."
domains:
  legal:
    sources:
      - name: LegalBench
        url: https://hazyresearch.stanford.edu/legalbench/
        accessed: 2026-06-07
      - name: LawBench
        url: https://github.com/open-compass/LawBench
        accessed: 2026-06-07
      - name: CaseHOLD
        url: https://reglab.stanford.edu/data/
        accessed: 2026-06-07
      - name: MAUD
        url: https://nlp.stanford.edu/projects/maud/
        accessed: 2026-06-07
    tier_overrides:
      premium_legal:
        - claude-opus-*
        - anthropic/claude-opus-*
        - gpt-5*
        - openai/gpt-5*
        - o1*
        - openai/o1*
        - gemini-3.1-pro*
        - google/gemini-3.1-pro*
      advanced_legal:
        - claude-sonnet-4.5*
        - claude-sonnet-4.6*
        - anthropic/claude-sonnet-4.*
        - gpt-4o
        - openai/gpt-4o
