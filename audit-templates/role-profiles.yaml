# Role profiles for KB Creation Framework v3.1 model recommendation.
# Drives Recommend-Models.ps1 role filtering, scoring weights, and cost estimates.
# Operators may edit these values for local policy or model-market changes.
_about:
  last_updated: 2026-06-07
  schema_version: 1
  notes: "Role requirements are guardrails, not guarantees. Validate recommended models against current provider catalogs and task-specific needs."
roles:
  lead:
    requirements:
      min_context_length: 128000
      capability_tier_allowlist: [premium, advanced]
      supports_tools: true
      preferred_families: [anthropic, openai, google]
    typical_token_ratio:
      input: 0.70
      output: 0.30
    sensitivity_to_quality: high
    sensitivity_to_cost: low
  builder_a_b:
