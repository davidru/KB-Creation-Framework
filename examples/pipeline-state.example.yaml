    dispatch_fingerprint_match: true
    timestamp: 2026-06-08T04:18:00Z

  - phase_id: '7.0'
    phase_label: Final audit
    role: Auditor
    intended_handle: auditor-minimax-m3
    actual_model_id: minimax/minimax-m3
    actual_provider: openrouter
    actual_family: minimax
    dispatch_status: dispatched-as-intended
    dispatch_fingerprint_match: true
    timestamp: 2026-06-08T05:01:00Z

  - phase_id: '8.0'
    phase_label: Stress-test memo fact-check
    role: Stress-test memo fact-checker
    intended_handle: memofactcheck-mistral-large2512
    actual_model_id: mistralai/mistral-large-2512
    actual_provider: openrouter
    actual_family: mistral
    dispatch_status: dispatched-as-intended
    dispatch_fingerprint_match: true
    timestamp: 2026-06-08T05:47:00Z

# Optional. Each entry marks a mid-build re-assignment that atomically rewrote
# model_assignment above (the file should reflect the LATEST assignment after
# overrides — old handles are recorded here for audit). Subsequent phase_log
# entries log dispatch_status: dispatched-after-override.
mid_build_overrides: []
